server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: edge-node
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/edge_db;CIPHER=AES;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${CLINIC_EDGE_DB_KEY:edge_secret_alpha_key} ${CLINIC_EDGE_DB_KEY:edge_secret_alpha_key}
  flyway:
    enabled: true
    locations: classpath:db/migration/edge

clinic:
  node-id: ${CLINIC_NODE_ID:clinic-alpha}
  scope: ${CLINIC_SCOPE:clinic-alpha}
  central-url: ${CENTRAL_SERVER_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
