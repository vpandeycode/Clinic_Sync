server:
  port: ${SERVER_PORT:8081}
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2048

spring:
  application:
    name: edge-node
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/edge_db;CIPHER=AES;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${CLINIC_EDGE_DB_KEY:edge_secret_alpha_key}
  flyway:
    enabled: true
    locations: classpath:db/migration/edge

clinic:
  node-id: ${CLINIC_NODE_ID:clinic-alpha}
  scope: ${CLINIC_SCOPE:clinic-alpha}
  central-url: ${CENTRAL_SERVER_URL:http://localhost:8080}

# Sync agent behaviour: bounded batches, retries with exponential backoff + jitter.
sync:
  max-attempts: ${SYNC_MAX_ATTEMPTS:5}
  batch-size: ${SYNC_BATCH_SIZE:50}
  pull-page-size: ${SYNC_PULL_PAGE_SIZE:50}
  max-pages-per-sync: 200
  max-pushes-per-sync: 200
  backoff-base-ms: ${SYNC_BACKOFF_BASE_MS:200}
  backoff-max-ms: ${SYNC_BACKOFF_MAX_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
