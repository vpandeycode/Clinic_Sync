server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2048

spring:
  application:
    name: central-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinic_central}
    username: ${SPRING_DATASOURCE_USERNAME:clinic_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:clinic_secret_pass}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration/central

# Sync protocol guardrails
sync:
  # Reject changes whose HLC physical time is ahead of central by more than this (5 minutes).
  max-clock-drift-ms: ${SYNC_MAX_CLOCK_DRIFT_MS:300000}
  pull-page-size: ${SYNC_PULL_PAGE_SIZE:100}
  max-pull-limit: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info
