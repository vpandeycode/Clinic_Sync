name: CI

on:
  push:
    branches: [ Main, master ]
  pull_request:
    branches: [ Main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify and Run Tests
        run: mvn clean verify -B
